services:
  listener:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_SESSION: ${TG_SESSION}
      TG_CHANNELS: ${TG_CHANNELS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/calls
      OLLAMA_URL: http://ollama:11434
      N8N_REPOST_WEBHOOK: http://${N8N_HOST}:5678/webhook/repost
      REPOST_HMAC_SECRET: ${REPOST_HMAC_SECRET}
      CALLBACK_BIND: 0.0.0.0
      CALLBACK_PORT: "8787"
      REPOST_MIN_CONFIDENCE: "0.7"
    volumes:
      - listener-data:/data
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calls
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d calls"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgweb:
    image: sosedoff/pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/calls?sslmode=disable
    depends_on: [db]
    # Give this one a Coolify domain + basic auth if you want browser access

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  listener-data:
  db-data:
  ollama-models: